mode=server
transport=websocket
listen=127.0.0.1:19443
listen_backlog=256
server_name=example.org
host_header=example.org
path=/assets/live/v6

websocket_ping_sec=25
websocket_pong_timeout_sec=60
websocket_poll_ms=3
websocket_upgrade_timeout_sec=10
websocket_io_timeout_sec=120
session_max_age_sec=3600

dev=pcdn0
cidr=fd87:42::1/126
peer_cidr=fd87:42::2/126
mtu=1280

psk_file=/etc/pacetun-cdn/pacetun.psk

profile=balanced
resource_profile=normal
queue_packets=4096
queue_bytes=8388608
queue_delay_ms=500
batch_packets=4
batch_bytes=16384
adaptive_batching=1
adaptive_batch_min_packets=1
adaptive_batch_max_packets=8
queue_target_delay_ms=25

connect_timeout_sec=20
idle_timeout_sec=300
keepalive_sec=15
rtt_probe_sec=15
reconnect_initial_ms=1000
reconnect_max_ms=30000
reconnect_jitter_pct=30

tcp_keepidle_sec=30
tcp_keepintvl_sec=10
tcp_keepcnt=6
tcp_user_timeout_ms=120000
sndbuf=4194304
rcvbuf=4194304
stats_interval_sec=30
control_socket=/run/pacetun-cdn/control.sock
control_mode=0660
strict_file_permissions=1
websocket_padding_max_bytes=0

websocket_control_padding_bytes=0
padding_budget_pct=0
timing_jitter_pct=0
log_format=human

latency_renew_ms=600
latency_renew_samples=3
latency_renew_cooldown_sec=180
idle_probe_sec=20

reply_degraded_sec=10
reply_renew_sec=30
reply_timeout_sec=60
candidate_max_rtt_ms=1500

#no pool
max_connections=1
flow_scheduler=1

pool_drain_sec=30
pool_idle_poll_ms=100
address_family=auto

#add shaping traffic if you want
#will improve later
